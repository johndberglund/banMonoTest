<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Impossible types</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d26;
    --panel2: #20242f;
    --border: #2c303c;
    --text: #e8eaf0;
    --text-dim: #9aa0b0;
    --accent: #4ec9a8;
    --accent2: #7fa1ff;
    --hot: #e0576e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    font-size: 14px;
  }
  body { display: flex; }

  #sidebar {
    width: 340px; min-width: 340px; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  #search-wrap { padding: 10px; border-bottom: 1px solid var(--border); }
  #search {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    font-size: 13px;
  }
  #search:focus { outline: 1px solid var(--accent2); }
  #summary { padding: 6px 10px 10px; color: var(--text-dim); font-size: 12px; border-bottom: 1px solid var(--border); }
  #summary .hint { opacity: 0.65; }

  #list { flex: 1; overflow-y: auto; }
  .group-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; cursor: pointer; user-select: none;
    background: var(--panel2); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
    font-weight: 600; font-size: 12.5px; letter-spacing: 0.02em;
  }
  .group-header:hover { background: #262b38; }
  .group-header .count { color: var(--text-dim); font-weight: 400; }
  .group-header .chevron { display: inline-block; transition: transform 0.15s; margin-right: 6px; color: var(--text-dim); }
  .group-header.collapsed .chevron { transform: rotate(-90deg); }
  .group-items.collapsed { display: none; }

  .item {
    padding: 6px 12px 6px 26px; cursor: pointer; border-bottom: 1px solid #1e212a;
    display: flex; gap: 8px; align-items: baseline;
  }
  .item:hover { background: #232733; }
  .item.active { background: #29344a; border-left: 3px solid var(--accent2); padding-left: 23px; }
  .item .id { font-weight: 600; color: var(--accent2); min-width: 44px; }
  .item .label { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #empty-msg { padding: 16px; color: var(--text-dim); font-size: 13px; }

  #main {
    flex: 1; height: 100vh; overflow-y: auto; padding: 24px 32px 60px;
  }
  #placeholder { color: var(--text-dim); font-size: 15px; margin-top: 40px; text-align: center; }

  #detail { max-width: 980px; margin: 0 auto; }
  #detail h1 { font-size: 22px; margin: 0 0 4px; }
  #detail h1 .group-tag {
    font-size: 12px; font-weight: 600; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px;
    margin-left: 10px; vertical-align: middle; text-transform: none;
  }
  #meta {
    display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-dim);
    font-size: 12.5px; margin: 8px 0 18px;
  }
  #meta span b { color: var(--text); font-weight: 500; }

  #img-wrap {
    background: #0d0f14; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; text-align: center; margin-bottom: 20px;
  }
  #img-wrap img { max-width: 100%; max-height: 640px; border-radius: 4px; }
  #no-img { color: var(--text-dim); padding: 60px 0; font-size: 13px; }

  .block { margin-bottom: 18px; }
  .block h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); margin: 0 0 6px; font-weight: 600;
  }
  .block p { margin: 0; line-height: 1.55; }
  #reason-text {
    line-height: 1.65; color: var(--text); font-size: 14.5px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px;
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333846; border-radius: 5px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search id, group, homeo, orbifold, text…" autocomplete="off">
  </div>
  <div id="summary"></div>
  <div id="list"></div>
</div>

<div id="main">
  <div id="placeholder">Pick an impossible type on the left.</div>
  <div id="detail" style="display:none">
    <h1><span id="d-id"></span><span class="group-tag" id="d-group"></span></h1>
    <div id="meta"></div>
    <div id="img-wrap"></div>
    <div class="block" id="reason-block">
      <h2>Why it is impossible</h2>
      <p id="reason-text"></p>
    </div>
  </div>
</div>

<script src="data/impossibles_manifest.js"></script>
<script>
const DATA = window.IMPOSSIBLES_DATA || [];
const GROUPS = window.IMPOSSIBLES_GROUPS || [];
const byId = {};
DATA.forEach(r => byId[r.id] = r);

const collapsedGroups = new Set();
let activeId = null;

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const summaryEl = document.getElementById('summary');

function matches(row, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return [row.id, row.group, row.homeo, row.wallpaper_group, row.orbifold, row.paper_label, row.reason]
    .some(v => v && String(v).toLowerCase().includes(q));
}

// The ids the sidebar is actually showing, in the order it shows them -- so arrow-key stepping
// follows the visible list: it respects the search filter and skips collapsed groups.
function visibleIds() {
  const q = searchEl.value.trim();
  const shown = new Set(DATA.filter(r => matches(r, q)).map(r => r.id));
  const ids = [];
  for (const g of GROUPS) {
    if (collapsedGroups.has(g.group)) continue;
    for (const r of DATA) if (r.group === g.group && shown.has(r.id)) ids.push(r.id);
  }
  return ids;
}

function step(delta) {
  const ids = visibleIds();
  if (!ids.length) return;
  const i = ids.indexOf(activeId);
  let next;
  if (i === -1) next = delta > 0 ? ids[0] : ids[ids.length - 1];
  else {
    const j = i + delta;
    if (j < 0 || j >= ids.length) return;      // stop at the ends rather than wrapping
    next = ids[j];
  }
  activeId = next;
  showDetail(next);
  render();
  const el = listEl.querySelector('.item.active');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function render() {
  const q = searchEl.value.trim();
  const filtered = DATA.filter(r => matches(r, q));
  const filteredIds = new Set(filtered.map(r => r.id));

  summaryEl.innerHTML = (q
    ? `${filtered.length} of ${DATA.length} types match`
    : `${DATA.length} impossible types, ${GROUPS.length} groups`)
    + ' <span class="hint">· ←→ ↑↓ to step</span>';

  listEl.innerHTML = '';
  if (!filtered.length) {
    const d = document.createElement('div');
    d.id = 'empty-msg';
    d.textContent = 'No matches.';
    listEl.appendChild(d);
    return;
  }

  for (const g of GROUPS) {
    const rows = DATA.filter(r => r.group === g.group && filteredIds.has(r.id));
    if (!rows.length) continue;

    const header = document.createElement('div');
    header.className = 'group-header' + (collapsedGroups.has(g.group) ? ' collapsed' : '');
    header.innerHTML = `<span><span class="chevron">▾</span>${g.group}</span><span class="count">${rows.length}${q ? '' : ' / ' + g.count}</span>`;
    header.addEventListener('click', () => {
      if (collapsedGroups.has(g.group)) collapsedGroups.delete(g.group); else collapsedGroups.add(g.group);
      render();
    });
    listEl.appendChild(header);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'group-items' + (collapsedGroups.has(g.group) ? ' collapsed' : '');
    for (const r of rows) {
      const item = document.createElement('div');
      item.className = 'item' + (r.id === activeId ? ' active' : '');
      const label = r.homeo || r.wallpaper_group || '';
      item.innerHTML = `<span class="id">#${r.id}</span><span class="label">${label}</span>`;
      item.addEventListener('click', () => { activeId = r.id; showDetail(r.id); render(); });
      itemsWrap.appendChild(item);
    }
    listEl.appendChild(itemsWrap);
  }
}

function showDetail(id) {
  const r = byId[id];
  if (!r) return;
  document.getElementById('placeholder').style.display = 'none';
  const detail = document.getElementById('detail');
  detail.style.display = 'block';

  document.getElementById('d-id').textContent = '#' + r.id;
  document.getElementById('d-group').textContent = r.group;

  const metaParts = [];
  if (r.homeo) metaParts.push(`<span><b>homeo</b> ${r.homeo}</span>`);
  if (r.wallpaper_group) metaParts.push(`<span><b>wallpaper</b> ${r.wallpaper_group}</span>`);
  if (r.orbifold) metaParts.push(`<span><b>orbifold</b> ${r.orbifold}</span>`);
  if (r.paper_label) metaParts.push(`<span><b>paper</b> ${r.paper_label}${r.paper_no != null ? ' (fig. ' + r.paper_no + ')' : ''}</span>`);
  document.getElementById('meta').innerHTML = metaParts.join('');

  const imgWrap = document.getElementById('img-wrap');
  if (r.file) {
    imgWrap.innerHTML = `<img src="proofs/${encodeURI(r.file)}" alt="netshape proof for #${r.id}">`;
  } else {
    imgWrap.innerHTML = `<div id="no-img">No picture for this type.</div>`;
  }

  const reasonBlock = document.getElementById('reason-block');
  if (r.reason) {
    document.getElementById('reason-text').textContent = r.reason;
    reasonBlock.style.display = '';
  } else {
    reasonBlock.style.display = 'none';
  }

  document.getElementById('main').scrollTop = 0;
}

searchEl.addEventListener('input', render);

// Right/Down = next type, Left/Up = previous. Ignored while typing in the search box so the arrows
// still move the text cursor there; preventDefault stops Up/Down also scrolling the page.
document.addEventListener('keydown', e => {
  if (e.target === searchEl || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
});

// deep-link support: impossibles_viewer.html#406
function fromHash() {
  const id = location.hash.replace('#', '').trim();
  if (id && byId[id]) { activeId = id; showDetail(id); render(); }
}
window.addEventListener('hashchange', fromHash);

render();
fromHash();
</script>
</body>
</html>
